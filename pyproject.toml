[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jflap-cli"
version = "1.0.0"
description = "Headless CLI Controller & Model Context Protocol (MCP) Server for JFLAP 7.1"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Mridul Mathur", email = "mridul.mat@outlook.com" }
]
keywords = ["jflap", "automata", "mcp", "model-context-protocol", "turing-machine", "pda", "dfa", "nfa", "cfg"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: Education"
]

[project.scripts]
jflap = "jflap_cli:main"
jflap-mcp = "jflap_mcp:main"
